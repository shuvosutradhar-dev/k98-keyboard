name: Build K98 Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fix folder structure if uploaded as subfolder
      run: |
        if [ -d "PC_Power_K98_Keyboard_Project" ]; then
          cp -r PC_Power_K98_Keyboard_Project/* . 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PC-Power-K98-Keyboard-APK
        path: app/build/outputs/apk/debug/app-debug.apk
